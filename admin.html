<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>خدني - الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f6f6f6;color:#1f1f1f;font-family:Cairo,sans-serif;padding:14px}
.c{background:#fff;box-shadow:0 1px 6px #0002;border-radius:16px;padding:12px;margin:8px 0}input,button{font:inherit;border:0;border-radius:10px;padding:10px;margin:3px 0;width:100%}
input{background:#ececec;color:#1f1f1f}button{background:#ff7a00;color:#fff;font-weight:700}.r{background:#ff5a5f;color:#fff}.m{color:#777;font-size:14px}
.s{display:flex;gap:8px}.s div{flex:1;background:#fff;box-shadow:0 1px 6px #0002;border-radius:14px;padding:10px;text-align:center}.s b{display:block;font-size:22px;color:#ff7a00}</style></head><body>
<div id="lg"><h2>دخول الإدارة</h2><input id="em" type="email" placeholder="الإيميل"><input id="pw" type="password" placeholder="كلمة السر"><button onclick="lg()">دخول</button></div>
<div id="ad" style="display:none">
<div class="s"><div><b id="n1">0</b>طلبات اليوم</div><div><b id="n2">0</b>منتهية</div><div><b id="n3">0</b>الأرباح</div></div>
<h3>السواقين</h3><div class="c"><input id="dn" placeholder="اسم السائق"><input id="dp" type="tel" placeholder="رقم موبايله"><input id="dk" placeholder="رمز سري له"><button onclick="addD()">إضافة سائق</button></div><div id="ds"></div>
<h3>الطلبات</h3><div id="os"></div><button class="r" onclick="auth.signOut()">خروج</button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script>
const $=i=>document.getElementById(i),auth=firebase.auth();
const lg=()=>auth.signInWithEmailAndPassword($('em').value,$('pw').value).catch(()=>alert('بيانات غلط'));
auth.onAuthStateChanged(u=>{$('lg').style.display=u?'none':'block';$('ad').style.display=u?'block':'none';if(u)go()});
const addD=async()=>{if(!$('dn').value||!$('dp').value||!$('dk').value)return;await db.collection('drivers').add({name:$('dn').value,phone:$('dp').value,pin:$('dk').value});$('dn').value=$('dp').value=$('dk').value=''};
function go(){
 db.collection('drivers').onSnapshot(s=>{$('ds').innerHTML='';s.forEach(d=>{const x=d.data(),e=document.createElement('div');e.className='c';
  e.innerHTML=`${x.name} — ${x.phone} <span class="m">(رمز ${x.pin})</span>`;const b=document.createElement('button');b.className='r';b.textContent='حذف';
  b.onclick=()=>confirm('حذف؟')&&d.ref.delete();e.appendChild(b);$('ds').appendChild(e)})});
 db.collection('orders').orderBy('createdAt','desc').limit(60).onSnapshot(s=>{$('os').innerHTML='';let t=0,dn=0,sum=0;const today=new Date().toDateString();
  s.forEach(d=>{const o=d.data();if(o.createdAt&&o.createdAt.toDate().toDateString()==today){t++;if(o.status=='done'){dn++;sum+=o.price}}
   const e=document.createElement('div');e.className='c';
   e.innerHTML=`<b>${STATUS[o.status]}</b> · ${o.price} ${PRICING.currency}<div class="m">${o.name} ${o.phone}</div><div class="m">${o.from.text} ← ${o.to.text}</div><div class="m">${o.driverName?'السائق: '+o.driverName:''}</div>`;
   if(o.status!='done'&&o.status!='cancelled'){const b=document.createElement('button');b.className='r';b.textContent='إلغاء';b.onclick=()=>d.ref.update({status:'cancelled'});e.appendChild(b)}
   $('os').appendChild(e)});$('n1').textContent=t;$('n2').textContent=dn;$('n3').textContent=sum.toLocaleString('ar')})}
</script></body></html>
