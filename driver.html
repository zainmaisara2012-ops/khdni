<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>خدني - سائق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f6f6f6;color:#1f1f1f;font-family:Cairo,sans-serif;padding:14px}
.c{background:#fff;box-shadow:0 1px 6px #0002;border-radius:16px;padding:14px;margin:10px 0}input,button{font:inherit;width:100%;border:0;border-radius:12px;padding:12px;margin:4px 0}
input{background:#ececec;color:#1f1f1f}button{background:#ff7a00;color:#fff;font-weight:700}a{color:#ff7a00;font-weight:700}.m{color:#777}h3{margin:0 0 6px}</style></head><body>
<div id="login"><h2>دخول السائق</h2><input id="p" type="tel" placeholder="رقم الموبايل"><input id="k" type="password" placeholder="الرمز السري"><button onclick="login()">دخول</button></div>
<div id="app" style="display:none"><h2 id="hi"></h2><div id="list"></div><button style="background:#fff;color:#1f1f1f;box-shadow:0 1px 6px #0002" onclick="wa('أنا السائق: '+me.name+' - '+me.phone)">تواصل مع الإدارة عبر واتساب</button>
<button style="background:#333;color:#fff" onclick="localStorage.removeItem('drv');location.reload()">خروج</button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
let me=JSON.parse(localStorage.drv||'null');
function wa(extra){if(ADMIN_WHATSAPP.includes('000000'))return alert('رقم الواتساب غير مضبوط');
window.open('https://wa.me/'+ADMIN_WHATSAPP+'?text='+encodeURIComponent('مرحباً، بدي تواصل مع إدارة خدني'+(extra?'\n'+extra:'')),'_blank')}

async function login(){const s=await db.collection('drivers').where('phone','==',p.value).where('pin','==',k.value).get();
 if(s.empty)return alert('بيانات غلط');const d=s.docs[0];me={id:d.id,...d.data()};localStorage.drv=JSON.stringify(me);start()}
function start(){login_.style.display='none';app.style.display='block';hi.textContent='أهلاً '+me.name;
 db.collection('orders').where('status','in',['new','accepted','arrived']).onSnapshot(s=>{
  list.innerHTML='';s.forEach(d=>{const o=d.data();if(o.status!='new'&&o.driverId!=me.id)return;
   const e=document.createElement('div');e.className='c';
   const nav=`https://www.google.com/maps/dir/?api=1&destination=${o.from.lat},${o.from.lng}`;
   e.innerHTML=`<h3>${o.price.toLocaleString('ar')} ${PRICING.currency} · ${o.km} كم</h3><div>من: ${o.from.text}</div><div>إلى: ${o.to.text}</div>
   <div class="m">${o.status=='new'?'':o.name+' '+o.phone}</div>`+
   (o.status=='new'?`<button onclick="act('${d.id}','accepted')">قبول الطلب</button>`:
    `<a href="${nav}" target="_blank">فتح موقع الزبون بالخريطة</a><a href="tel:${o.phone}" style="margin-inline-start:14px">اتصال</a>`+
    (o.status=='accepted'?`<button onclick="act('${d.id}','arrived')">وصلت للزبون</button>`:`<button onclick="act('${d.id}','done')">إنهاء الرحلة</button>`));
   list.appendChild(e)});if(!list.children.length)list.innerHTML='<p class="m">لا يوجد طلبات حالياً</p>'})}
async function act(id,st){const r=db.collection('orders').doc(id);
 await db.runTransaction(async t=>{const o=(await t.get(r)).data();
  if(st=='accepted'){if(o.status!='new')throw'taken';t.update(r,{status:st,driverId:me.id,driverName:me.name,driverPhone:me.phone})}else t.update(r,{status:st})}).catch(()=>alert('الطلب أُخذ من سائق آخر'))}
const login_=document.getElementById('login'),app=document.getElementById('app'),hi=document.getElementById('hi'),list=document.getElementById('list'),p=document.getElementById('p'),k=document.getElementById('k');
if(me)start();
</script></body></html>
